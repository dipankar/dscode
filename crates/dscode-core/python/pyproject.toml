[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "dscode-core"
version = "0.2.0"
description = "Python bindings for dscode-core: text buffer and configuration utilities for DSCode IDE"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Editors",
]

[project.urls]
Repository = "https://github.com/dipankar/dscode"
Documentation = "https://github.com/dipankar/dscode/tree/main/crates/dscode-core/python"