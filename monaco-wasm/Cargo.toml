[package]
name = "monaco-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dscode-dev/dscode"
description = "WASM-based fast syntax tokenizer for Monaco Editor"
authors = ["DSCode Contributors"]
readme = "README.md"
keywords = ["wasm", "tokenizer", "monaco", "syntax"]
categories = ["development-tools", "wasm"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
lto = true
opt-level = 3
strip = true
