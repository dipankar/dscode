name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npx tsc --noEmit

      - run: npm run lint

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --workspace

      - run: cargo clippy --workspace -- -D warnings

      - run: cargo test --workspace

  extension-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension-host/package-lock.json

      - run: npm ci
        working-directory: extension-host

      - run: npx tsc --noEmit
        working-directory: extension-host

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-audit
      - run: cargo audit

  build:
    runs-on: ubuntu-latest
    needs: [frontend, rust, extension-host]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Tauri dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - run: cargo check --workspace

      - run: npm run build

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish dry-run dscode-core
        run: cargo publish -p dscode-core --dry-run
      - name: Publish dry-run dscode-lsp
        run: cargo publish -p dscode-lsp --dry-run
      - name: Publish dry-run dscode-dap
        run: cargo publish -p dscode-dap --dry-run
      - name: Publish dry-run dscode-extension-host
        run: cargo publish -p dscode-extension-host --dry-run
      - name: Publish dry-run dscode-terminal
        run: cargo publish -p dscode-terminal --dry-run
      - name: Publish dry-run dscode-session
        run: cargo publish -p dscode-session --dry-run
