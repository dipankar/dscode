name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npx tsc --noEmit

      - run: npm run lint

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo check
        working-directory: src-tauri

      - run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - run: cargo test
        working-directory: src-tauri

  extension-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension-host/package-lock.json

      - run: npm ci
        working-directory: extension-host

      - run: npx tsc --noEmit
        working-directory: extension-host

  build:
    runs-on: ubuntu-latest
    needs: [frontend, rust, extension-host]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: cargo check
        working-directory: src-tauri

      - run: npm run build
