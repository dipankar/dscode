name: Publish npm Packages

# Publishes npm packages to the npm registry with provenance attestations.
# Provenance uses OIDC to cryptographically link the package to this
# GitHub Actions workflow run, providing supply-chain transparency.
#
# NOTE: npm authentication still requires a token (npm does not support
# fully tokenless OIDC publishing like PyPI/crates.io). We use a
# dedicated automation token scoped to the two packages below.
#
# Prerequisites:
#   - Set secret NPM_AUTOMATION_TOKEN (npm automation token with
#     publish-only scope for dscode-extension-host and @dscode/monaco-wasm)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to verify before publishing (e.g. 0.2.0)'
        required: false
        default: ''

jobs:
  publish-extension-host:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # Required for npm provenance / OIDC attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify version (if specified)
        if: github.event.inputs.version != ''
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION=$(node -p "require('./extension-host/package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "Error: extension-host version is $PKG_VERSION, expected $VERSION"
            exit 1
          fi

      - name: Build extension host
        run: |
          cd extension-host
          npm ci
          npm run build

      - name: Publish extension host
        run: |
          cd extension-host
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}

  publish-monaco-wasm:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # Required for npm provenance / OIDC attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify version (if specified)
        if: github.event.inputs.version != ''
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION=$(node -p "require('./monaco-wasm/package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "Error: monaco-wasm version is $PKG_VERSION, expected $VERSION"
            exit 1
          fi

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: |
          cd monaco-wasm
          npm run build

      - name: Publish monaco-wasm
        run: |
          cd monaco-wasm
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}

  publish-dscode:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify version (if specified)
        if: github.event.inputs.version != ''
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION=$(node -p "require('./packages/npm/package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "Error: dscode-app package version is $PKG_VERSION, expected $VERSION"
            exit 1
          fi

      - name: Publish dscode-app binary wrapper
        run: |
          cd packages/npm
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
