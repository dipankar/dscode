[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
ignore = [
    # RUSTSEC-2025-0020: idna accepts Punycode data that does not round-trip
    # Affects idna 0.5.x which is pulled in by pyo3 0.23.x.
    "RUSTSEC-2025-0020",
    # RUSTSEC-2024-0413: gtk-rs GTK3 bindings are no longer maintained
    # Affects gtk 0.18.x which is pulled in by wry/tauri-runtime-wry.
    "RUSTSEC-2024-0413",
    # RUSTSEC-2024-0370: proc-macro-error is unmaintained
    # Affects proc-macro-error 1.0.x which is pulled in by gtk3-macros.
    "RUSTSEC-2024-0370",
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
