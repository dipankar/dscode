[workspace]
resolver = "2"
members = [
    "crates/dscode-core",
    "crates/dscode-core/python",
    "crates/dscode-lsp",
    "crates/dscode-dap",
    "crates/dscode-extension-host",
    "crates/dscode-session",
    "crates/dscode-terminal",
    "src-tauri",
    "monaco-wasm",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/dipankar/dscode"
homepage = "https://github.com/dipankar/dscode"
documentation = "https://docs.rs/dscode-core"
authors = ["DSCode Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }