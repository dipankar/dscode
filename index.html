<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vscode-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DSCode — a fast, lightweight, fully hackable Visual Studio Code alternative built with Rust, Tauri, and Svelte." />
    <meta name="keywords" content="code editor, IDE, VS Code alternative, Rust, Tauri, Svelte, Monaco, hackable" />
    <meta property="og:title" content="DSCode — Hackable VS Code Alternative" />
    <meta property="og:description" content="A fast, lightweight code editor built with Rust and Svelte. Fully hackable and extensible." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>DSCode</title>

    <!-- Preload critical resources -->
    <link rel="modulepreload" href="/src/main.ts" />
    <link rel="modulepreload" href="/src/App.svelte" />

    <!-- Runtime theme detection before CSS renders -->
    <script>
      (function() {
        const theme = localStorage.getItem('dscode-theme');
        if (theme === 'light') {
          document.documentElement.style.setProperty('--color-bg', '#ffffff');
          document.documentElement.style.setProperty('--color-text', '#1e1e1e');
          document.documentElement.style.setProperty('--color-text-secondary', '#616161');
          document.documentElement.style.setProperty('--color-border', '#cccccc');
        } else if (theme === 'highcontrast') {
          document.documentElement.style.setProperty('--color-bg', '#000000');
          document.documentElement.style.setProperty('--color-text', '#ffffff');
          document.documentElement.style.setProperty('--color-text-secondary', '#ffffff');
          document.documentElement.style.setProperty('--color-border', '#ffffff');
        }
      })();
    </script>

    <!-- Emergency fallback: hide loading screen after 3s if JS is stalled -->
    <script>
      (function() {
        function hide() {
          var el = document.querySelector('.loading-screen');
          if (el) el.remove();
          // If the startup controller loaded, tell it we forced a mount
          if (window.startupController && window.startupController.markMounted) {
            window.startupController.markMounted();
          }
        }
        setTimeout(hide, 3000);
      })();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body, html, #app {
        width: 100%;
        height: 100%;
        background-color: var(--color-bg, #1e1e1e);
        color: var(--color-text, #cccccc);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        overflow: hidden;
      }

      /* === Branded Loading Screen === */
      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--color-bg, #1e1e1e);
        transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
      }

      /* Hidden state: used by the startup state machine to fade out the splash */
      .loading-screen--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Entrance animation for loading content */
      .loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: loading-entrance 0.4s ease-out;
      }

      @keyframes loading-entrance {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Logo icon - CSS-only rounded square with "DS" monogram */
      .loading-logo-icon {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: linear-gradient(135deg, #007acc, #0098ff);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        box-shadow: 0 4px 16px rgba(0, 122, 204, 0.25);
        animation: logo-glow 2.5s ease-in-out infinite;
      }

      .loading-logo-text {
        font-size: 26px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 1px;
        line-height: 1;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      @keyframes logo-glow {
        0%, 100% {
          box-shadow: 0 4px 16px rgba(0, 122, 204, 0.2);
        }
        50% {
          box-shadow: 0 6px 24px rgba(0, 122, 204, 0.4);
        }
      }

      /* App name with accent on "DS" */
      .loading-title {
        font-size: 22px;
        font-weight: 300;
        letter-spacing: 4px;
        margin: 0 0 4px 0;
        color: var(--color-text, #cccccc);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .loading-title-ds {
        font-weight: 600;
        color: var(--color-accent, #007acc);
      }

      .loading-title-code {
        font-weight: 300;
        color: var(--color-text, #cccccc);
      }

      /* Version label */
      .loading-version {
        font-size: 11px;
        font-weight: 400;
        color: var(--color-text-secondary, #6e6e6e);
        letter-spacing: 1.5px;
        margin: 0 0 32px 0;
      }

      /* Spinner - rotating ring */
      .loading-spinner {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loading-spinner-ring {
        width: 24px;
        height: 24px;
        border: 2px solid var(--color-border, #3e3e42);
        border-top-color: var(--color-accent, #007acc);
        border-radius: 50%;
        animation: loading-spin 0.9s linear infinite;
      }

      @keyframes loading-spin {
        to { transform: rotate(360deg); }
      }

      /* Light theme awareness (before JS/CSS custom properties load) */
      @media (prefers-color-scheme: light) {
        .loading-screen {
          background-color: #ffffff;
        }

        .loading-title,
        .loading-title-code {
          color: #1e1e1e;
        }

        .loading-title-ds {
          color: #007acc;
        }

        .loading-version {
          color: #616161;
        }

        .loading-spinner-ring {
          border-color: #cccccc;
          border-top-color: #007acc;
        }
      }

      /* Respect reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        .loading-content {
          animation: none;
        }

        .loading-logo-icon {
          animation: none;
        }

        .loading-spinner-ring {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Branded loading screen - renders instantly before JS loads -->
    <div class="loading-screen" aria-label="Loading DSCode">
      <div class="loading-content">
        <div class="loading-logo-icon">
          <span class="loading-logo-text">DS</span>
        </div>
        <h1 class="loading-title">
          <span class="loading-title-ds">DS</span><span class="loading-title-code">Code</span>
        </h1>
        <p class="loading-version">v0.2.0</p>
        <div class="loading-spinner">
          <div class="loading-spinner-ring"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
