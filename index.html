<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vscode-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSCode</title>

    <!-- Preload critical resources -->
    <link rel="modulepreload" href="/src/main.ts" />
    <link rel="modulepreload" href="/src/App.svelte" />

    <!-- Inline critical CSS for instant render -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body, html, #app {
        width: 100%;
        height: 100%;
        background-color: #1e1e1e;
        color: #cccccc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        overflow: hidden;
      }

      /* === Branded Loading Screen === */
      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #1e1e1e;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }

      /* Fade out when Svelte app is ready */
      #app[data-app-ready] + .loading-screen,
      #app[data-app-ready] ~ .loading-screen {
        opacity: 0;
        visibility: hidden;
      }

      /* Logo icon */
      .loading-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
      }

      /* App name */
      .loading-title {
        font-size: 28px;
        font-weight: 300;
        letter-spacing: 4px;
        color: #e0e0e0;
        margin-bottom: 6px;
      }

      /* Version */
      .loading-version {
        font-size: 12px;
        font-weight: 400;
        color: #6e6e6e;
        letter-spacing: 1px;
        margin-bottom: 32px;
      }

      /* Animated dots indicator */
      .loading-dots {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
      }

      .loading-dots span {
        display: block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #007acc;
        animation: dot-pulse 1.4s ease-in-out infinite;
      }

      .loading-dots span:nth-child(1) {
        animation-delay: 0s;
      }

      .loading-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loading-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dot-pulse {
        0%, 80%, 100% {
          opacity: 0.2;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      /* Light theme detection for loading screen */
      @media (prefers-color-scheme: light) {
        .loading-screen {
          background-color: #ffffff;
        }

        .loading-title {
          color: #1e1e1e;
        }

        .loading-version {
          color: #999999;
        }

        .loading-dots span {
          background-color: #007acc;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Branded loading screen - renders instantly before JS loads -->
    <div class="loading-screen">
      <svg class="loading-logo" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#007acc"/>
            <stop offset="100%" stop-color="#0098ff"/>
          </linearGradient>
        </defs>
        <rect width="128" height="128" rx="24" fill="url(#logo-grad)"/>
        <text x="64" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" fill="white" text-anchor="middle">DS</text>
      </svg>
      <div class="loading-title">DSCode</div>
      <div class="loading-version">v0.1.0</div>
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
