[package]
name = "dscode"
version = "0.1.0"
description = "A blazingly fast, Rust-based Visual Studio Code alternative"
authors = ["DSCode Contributors"]
license = "MIT"
repository = "https://github.com/yourusername/dscode"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"

# Text processing
ropey = "1.6"
tree-sitter = "0.20"

# LSP
tower-lsp = "0.20"
lsp-types = "0.94"

# Git
git2 = "0.18"

# IPC (for backend services)
nng = "1.0"
rkyv = "0.7"

# File watching
notify = "6.1"

# Async runtime
async-trait = "0.1"

# System monitoring
sysinfo = "0.30"

[features]
default = []
