[package]
name = "dscode"
version = "0.1.0"
description = "A blazingly fast, Rust-based Visual Studio Code alternative"
authors = ["DSCode Contributors"]
license = "MIT"
repository = "https://github.com/dipankar/dscode"
readme = "README.md"
keywords = ["ide", "editor", "tauri"]
categories = ["development-tools"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.1", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Library crates
dscode-core = { path = "../crates/dscode-core", version = "0.1.0" }
dscode-lsp = { path = "../crates/dscode-lsp", version = "0.1.0" }
dscode-dap = { path = "../crates/dscode-dap", version = "0.1.0" }
dscode-extension-host = { path = "../crates/dscode-extension-host", version = "0.1.0", features = ["tauri"] }
dscode-terminal = { path = "../crates/dscode-terminal", version = "0.1.0", features = ["tauri"] }
dscode-session = { path = "../crates/dscode-session", version = "0.1.0", features = ["tauri"] }

# Git
git2 = "0.18"

# File watching
notify = "6.1"

# Search (ripgrep-based)
ignore = "0.4"
grep-searcher = "0.1"
grep-matcher = "0.1"
grep-regex = "0.1"
regex = "1.10"
globset = "0.4"
walkdir = "2.4"
glob = "0.3"

# Async runtime
async-trait = "0.1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Directories
semver = "1.0"
dirs = "5.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# System monitoring
sysinfo = "0.30"

# Extension management
zip = "2.1"
sha2 = "0.10"
quick-xml = "0.31"
reqwest = { version = "0.11", features = ["json", "blocking"] }
tempfile = "3.8"
once_cell = "1"

# Security & keyring
keyring = "2.3"

# Memory allocators
tikv-jemallocator = { version = "0.5", optional = true }
mimalloc = { version = "0.1", optional = true }

[features]
default = ["jemalloc"]
jemalloc = ["tikv-jemallocator"]
mimalloc-allocator = ["mimalloc"]
system-allocator = []
