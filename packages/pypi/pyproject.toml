[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dscode-app"
version = "0.3.0"
description = "DSCode — a fast, hackable Visual Studio Code alternative built in Rust. Installs the native binary automatically."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Text Editors",
]
keywords = ["vscode", "code-editor", "ide", "dscode", "tauri", "rust", "editor"]

[project.scripts]
dscode = "dscode:main"

[project.urls]
Repository = "https://github.com/dipankar/dscode"
Documentation = "https://github.com/dipankar/dscode/tree/main/packages/pypi"
